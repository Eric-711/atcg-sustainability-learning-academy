<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATCG Grade-Level Learning Companion</title><style>body{margin:0;background:#07192c;color:#edf9ff;font:16px system-ui}header{padding:20px;background:#103354}h1{margin:0 0 8px}main{max-width:1250px;margin:auto;padding:18px}select,button,a{font:inherit}select,button{padding:10px;border-radius:8px}button{cursor:pointer;background:#b6f4dd;color:#09263b;border:0;font-weight:700}a{color:#99eaff}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px;margin-top:18px}.panel{background:#102b46;border:1px solid #31516b;border-radius:12px;padding:15px}.gameframe{width:100%;height:620px;border:0;background:#fff;border-radius:8px}.answer{display:block;width:100%;text-align:left;margin:8px 0;background:#dcefff}.answer:disabled{opacity:.75}.feedback{min-height:3em}small{color:#bdd3e3}@media(max-width:850px){.layout{grid-template-columns:1fr}.gameframe{height:430px}}@media print{body *{visibility:hidden!important}#certificate,#certificate *{visibility:visible!important}#certificate{position:absolute;left:0;top:0;width:95%;padding:35px;color:#172e4b;background:white;border:8px double #c5a24c;font-size:20px;text-align:center}#certificate h2{font-size:38px}}.reward{border:2px solid #f0cb65;border-radius:12px;padding:15px;margin:12px 0;background:#193d50}.reward strong{color:#ffe5a1}.mission-next{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}</style></head><body><header><h1>🎓 ATCG Grade-Level Learning Companion</h1><p>Original games stay unchanged. Explore the game, then answer questions at your grade level.</p><a href="index.html">← ATCG Academy Home</a></header><main><div class="controls"><label>Choose game <select id="game"></select></label><label>Grade level <select id="level"><option value="6">Kindergarten (K)</option><option value="3">Grade 1</option><option value="4">Grade 2</option><option value="0">Elementary (Grades 3–5)</option><option value="1">Middle School (Grades 6–8)</option><option value="2">High School — original game</option></select></label><label>Mission mode <select id="mode"><option value="missions">Interactive missions (100 per game and grade band)</option><option value="classic">Original checkpoints</option></select></label><button id="restart">Restart questions</button></div><div class="layout"><section class="panel"><h2 id="gameTitle"></h2><p><a id="original" target="_blank" rel="noopener">Open original game in new tab</a></p><iframe class="gameframe" id="frame" title="Original ATCG interactive game" loading="lazy"></iframe><small>If a game cannot run inside this frame, use the original game link above.</small></section><aside class="panel" id="quiz" aria-live="polite"></aside></div></main><script src="grade-mission-question-bank.js"></script><script>const games=[["World Explorer","world-explorer.html",[["What does a map show?",["Places and locations","Only animals","Only numbers"],0,"Maps help us find places."],["Which direction is opposite north?",["East","South","West"],1,"South is opposite north."],["What is an ocean?",["A large body of salt water","A mountain","A desert"],0,"Oceans cover much of Earth."]],[["How does latitude help describe a place?",["Its distance north or south of the equator","Its population","Its height above sea level"],0,"Latitude measures angular distance from the equator."],["Why are equatorial regions often warmer?",["They receive more direct sunlight","They are closer to the Moon","They have no seasons"],0,"Sun angle affects energy received per area."],["Which map feature helps compare real distances?",["Scale","Legend color only","Title only"],0,"Scale relates map distance to actual distance."]]],["Future City","open-world.html",[["What does a traffic light help keep safe?",["Road travel","Clouds","Trees"],0,"Traffic signals organize movement."],["Which is renewable energy?",["Sunlight","Coal","Gasoline"],0,"Sunlight is naturally replenished."],["Why do cities need parks?",["For green space","To stop all rain","To remove oxygen"],0,"Parks provide habitat and recreation."]],[["How can public transportation reduce pollution?",["It can reduce vehicles per traveler","It always increases fuel use","It eliminates electricity"],0,"Shared trips can reduce emissions per person."],["Which surface often increases stormwater runoff?",["Pavement","Healthy soil","Grass"],0,"Impervious surfaces prevent infiltration."],["What is a trade-off in city planning?",["Balancing benefits and costs","Ignoring evidence","Choosing randomly"],0,"Design decisions balance competing needs."]]],["Curriculum Adventure Arcade","curriculum-arcade.html",[["What do plants need to grow?",["Light and water","Plastic","Only rocks"],0,"Plants use light and water."],["What is 6 + 4?",["8","10","12"],1,"Six plus four is ten."],["What can a thermometer measure?",["Temperature","Length","Sound"],0,"Thermometers measure temperature."]],[["Which is evidence from an experiment?",["Recorded measurements","A guess","An advertisement"],0,"Measurements are observable evidence."],["A plant grows 2 cm each week. How much in 4 weeks?",["6 cm","8 cm","12 cm"],1,"2 multiplied by 4 is 8."],["Why should scientists repeat trials?",["To check reliability","To hide mistakes","To change the question"],0,"Repeated trials help assess consistency."]]],["Virtual Science Laboratory","virtual-science-lab.html",[["What should you wear to protect your eyes?",["Safety goggles","Sandals","A scarf"],0,"Goggles protect your eyes."],["What happens to ice when it warms?",["It melts","It turns into wood","It disappears forever"],0,"Ice melts into liquid water."],["Which tool measures liquid volume?",["Graduated cylinder","Ruler","Magnet"],0,"Graduated cylinders measure volume."]],[["What is the independent variable?",["What the investigator changes","What is measured","What stays constant"],0,"It is the deliberately changed factor."],["Why use a control group?",["For comparison","To add bias","To avoid measurement"],0,"Controls provide a baseline."],["Which graph best shows temperature over time?",["Line graph","Pie chart","Map"],0,"Line graphs show change over time."]]],["Simulation Lab","simulations.html",[["What is a simulation?",["A model of something real","A kind of lunch","A planet"],0,"Simulations represent systems or processes."],["What happens when water freezes?",["It becomes solid","It becomes fire","It vanishes"],0,"Freezing changes liquid water to ice."],["Which energy source uses moving air?",["Wind turbine","Battery only","Coal mine"],0,"Wind turbines capture energy from moving air."]],[["Why change one variable at a time?",["To identify cause and effect","To make results random","To skip observations"],0,"Controlled changes make effects easier to interpret."],["What is a limitation of a simulation?",["It simplifies reality","It is always perfect","It cannot be tested"],0,"Models cannot represent every detail."],["What increases the output of an ideal wind turbine?",["Greater wind speed","Less moving air","No blades"],0,"Wind speed strongly influences available power."]]],["Sports Exam Challenge","sports-exam-games.html",[["A team scores 3 points twice. Total?",["5","6","9"],1,"Three plus three equals six."],["What does a stopwatch measure?",["Time","Mass","Temperature"],0,"Stopwatches measure elapsed time."],["Which habit helps athletes?",["Drinking water","Skipping sleep","Avoiding practice"],0,"Hydration supports activity."]],[["A runner covers 200 m in 40 s. Average speed?",["5 m/s","8 m/s","40 m/s"],0,"Speed equals distance divided by time."],["Which evidence best compares two training plans?",["Results from repeated trials","One opinion","A slogan"],0,"Repeated comparable measurements support conclusions."],["A score rises from 60 to 75. Percent increase?",["15%","25%","75%"],1,"15 divided by 60 is 25%."]]],["Global Curriculum Explorer","global-curriculum.html",[["What do students around the world use to learn?",["Questions and practice","Only one language","Only games"],0,"Learning uses many approaches."],["Which is a continent?",["Africa","Pacific Ocean","Moon"],0,"Africa is a continent."],["What can help you learn a new word?",["An example","Ignoring it","Guessing forever"],0,"Examples build meaning."]],[["Why compare different regions' ecosystems?",["To identify patterns and differences","To assume they are identical","To avoid evidence"],0,"Comparisons reveal relationships."],["What makes a source trustworthy?",["Evidence and clear authorship","Lots of emojis","No date or author"],0,"Check evidence, expertise, and context."],["Which is a transferable science skill?",["Analyzing data","Memorizing one website address","Skipping measurements"],0,"Data analysis applies across curricula."]]]];const earlyGrades=[[[["Which direction is at the top of most maps?",["North","Down","Inside"],0,"Many maps put north at the top."],["What is a river?",["Flowing water","A mountain","A road"],0,"Rivers carry flowing water."],["Which is a place people live?",["Town","Cloud","Sun"],0,"People live in towns."]],[["Why use crosswalks?",["To cross streets more safely","To race cars","To grow trees"],0,"Crosswalks mark places to cross."],["Which vehicle carries many people?",["Bus","Bicycle","Skateboard"],0,"Buses can carry groups."],["What gives a solar panel energy?",["Sunlight","Mud","Plastic"],0,"Solar panels use sunlight."]],[["What do roots take in?",["Water","Sunlight only","Clouds"],0,"Roots absorb water."],["What is 5 plus 2?",["7","4","9"],0,"Five plus two equals seven."],["What can you measure with a ruler?",["Length","Temperature","Time"],0,"Rulers measure length."]],[["What is a safe lab behavior?",["Follow instructions","Taste chemicals","Run around"],0,"Follow safety instructions."],["What happens when water gets very cold?",["It can freeze","It becomes wood","It becomes sand"],0,"Water freezes into ice."],["What do you use to measure temperature?",["Thermometer","Ruler","Scale"],0,"Thermometers measure temperature."]],[["What does a model help us do?",["Understand an idea","Eat lunch","Change the weather"],0,"Models help explain ideas."],["What can wind move?",["A kite","A mountain","A building always"],0,"Wind can move a kite."],["What happens to ice when heated?",["It melts","It grows","It burns"],0,"Ice melts to water."]],[["A team has 4 points and earns 2. Total?",["6","2","8"],0,"Four plus two equals six."],["Which tool measures a race time?",["Stopwatch","Ruler","Scale"],0,"Stopwatches measure time."],["Why warm up before activity?",["Prepare muscles","Make shoes heavier","Stop breathing"],0,"Warmups prepare the body."]],[["Which tool shows Earth?",["Globe","Clock","Thermometer"],0,"A globe models Earth."],["What can a picture help explain?",["An idea","Only a sound","Nothing"],0,"Pictures can communicate ideas."],["What do we call a question we test?",["Investigation question","Final score","Weather report"],0,"Questions guide investigations."]]],[[["Which map symbol explains colors and signs?",["Legend","Compass only","Calendar"],0,"A legend explains symbols."],["What is a continent?",["A large landmass","A tiny pond","A cloud"],0,"Continents are major land areas."],["What causes day and night?",["Earth rotating","Clouds moving","Rain falling"],0,"Earth's rotation causes day and night."]],[["What is one benefit of planting city trees?",["Shade","More exhaust","Less habitat"],0,"Trees provide shade."],["What happens to rain on pavement?",["It often runs off","It always disappears","It turns to snow"],0,"Pavement limits soaking in."],["Which is a clean energy source?",["Wind","Gasoline","Coal"],0,"Wind is renewable."]],[["Which is an observation?",["The leaf is green","The leaf is magic","The leaf is happiest"],0,"Color can be observed."],["What is 3 groups of 4?",["12","7","9"],0,"Three times four is twelve."],["Which chart shows amounts with bars?",["Bar graph","Map","Calendar"],0,"Bar graphs compare quantities."]],[["What should stay the same in a fair test?",["Other conditions","Every result","All questions"],0,"Control conditions in a fair test."],["What do plants release during photosynthesis?",["Oxygen","Plastic","Sand"],0,"Plants release oxygen."],["Which state has a fixed shape?",["Solid","Liquid","Gas"],0,"Solids keep their shape."]],[["Why repeat a simulation?",["To compare results","To erase learning","To make it real"],0,"Repeating helps compare results."],["Which is a renewable resource?",["Sunlight","Coal","Oil"],0,"Sunlight is renewable."],["Which force pulls objects toward Earth?",["Gravity","Light","Sound"],0,"Gravity pulls objects downward."]],[["A runner travels 10 meters then 5 more. Total?",["15 meters","5 meters","50 meters"],0,"Ten plus five equals fifteen."],["Which graph can show race times?",["Bar graph","Globe","Dictionary"],0,"Bar graphs can compare times."],["Why drink water during exercise?",["Replace fluids","Add weight to shoes","Stop sweating forever"],0,"Hydration replaces lost fluids."]],[["What is a primary source?",["An original record","A random guess","An advertisement always"],0,"Original records can be primary sources."],["Why compare two maps?",["Find similarities and differences","Make both identical","Avoid evidence"],0,"Comparisons reveal differences."],["What does a learning goal tell you?",["What you aim to learn","Your lunch","Your shoe size"],0,"Goals describe learning targets."]]],[[["What color is the ocean on many maps?",["Blue","Pink","Orange"],0,"Blue often represents water."],["Which is land?",["Island","Cloud","Rain"],0,"An island is land."],["Where is the sky?",["Above us","Under our shoes","Inside a book"],0,"Look up to see the sky."]],[["What helps a car stop safely?",["Brakes","Wings","Leaves"],0,"Brakes slow cars."],["What color means stop at a traffic light?",["Red","Green","Blue"],0,"Red means stop."],["Where can people walk safely?",["Sidewalk","River","Roof"],0,"Sidewalks are for walking."]],[["How many suns light Earth?",["One","Five","Ten"],0,"Earth has one Sun."],["What comes after 2?",["3","7","1"],0,"Count one, two, three."],["Which is a living thing?",["Tree","Rock","Pencil"],0,"Trees grow and need water."]],[["What protects your eyes in a lab?",["Goggles","Socks","Gloves only"],0,"Wear safety goggles."],["Is ice hot or cold?",["Cold","Hot","Both always"],0,"Ice is cold."],["Which is water?",["A liquid in a cup","A stone","A pencil"],0,"Water is a liquid at room temperature."]],[["What does a fan move?",["Air","Rocks","Sand only"],0,"Fans move air."],["What shines in the daytime?",["Sun","Flashlight only","Stars only"],0,"The Sun gives daylight."],["What happens to a puddle in sunshine?",["It can dry","It grows wheels","It turns to metal"],0,"Water can evaporate."]],[["How many balls are two plus one?",["Three","Five","One"],0,"Two plus one is three."],["Which body part helps you run?",["Legs","Ears","Nose"],0,"Legs help you move."],["What do you drink after playing?",["Water","Paint","Sand"],0,"Water helps you stay hydrated."]],[["What do we use to read?",["Books","Shoes","Rocks"],0,"Books help us learn."],["Which is a shape?",["Circle","Loud","Fast"],0,"A circle is a shape."],["What can we ask when curious?",["A question","A wall","A shoe"],0,"Questions help us learn."]]]];games.forEach((g,i)=>{g[4]=earlyGrades[0][i];g[5]=earlyGrades[1][i];g[6]=earlyGrades[2][i]});const game=document.getElementById('game'),level=document.getElementById('level'),quiz=document.getElementById('quiz'),frame=document.getElementById('frame'),original=document.getElementById('original');games.forEach((g,i)=>game.add(new Option(g[0],i)));let index=0,score=0,locked=false,checkpointAcknowledged=false;const checkpointSize=5;const awardKey='atcg-companion-awards-v1';let awards={};try{awards=JSON.parse(localStorage.getItem(awardKey)||'{}')}catch{};function saveAwards(){try{localStorage.setItem(awardKey,JSON.stringify(awards))}catch{}}function badgeFor(correct,total){return correct===total?'🏆 Gold Explorer':correct>=Math.ceil(total*.8)?'🥈 Silver Explorer':'🥉 Bronze Explorer'}function certificate(title,grade,number,correct,total){const wrap=document.createElement('section');wrap.id='certificate';wrap.className='reward';const heading=document.createElement('h2');heading.textContent='🏅 ATCG Academy Achievement Certificate';const p=document.createElement('p');p.textContent='Awarded to: ATCG Student Explorer';const details=document.createElement('p');details.textContent=grade+' • '+title+' • Checkpoint '+number;const result=document.createElement('h3');result.textContent=badgeFor(correct,total)+' — '+correct+' of '+total+' correct';const date=document.createElement('p');date.textContent='Completed '+new Date().toLocaleDateString();const note=document.createElement('small');note.textContent='Digital achievement only; no cash or physical prize is promised.';wrap.append(heading,p,details,result,date,note);return wrap}const mode=document.getElementById("mode");function render(){const g=games[+game.value],l=+level.value;document.getElementById('gameTitle').textContent=g[0];if(frame.getAttribute('src')!==g[1])frame.src=g[1];original.href=g[1];if(l===2&&mode.value==='classic'){quiz.replaceChildren();const h=document.createElement('h2');h.textContent='High School';const p=document.createElement('p');p.textContent='Continue with the original high-school activities in the game. No existing content has been replaced.';quiz.append(h,p);return}const bank=window.ATCG_MISSION_BANK;const missionMode=mode.value==='missions'&&bank;const mappedLevel=l===0?0:l===1?1:l===2?2:l===3?3:l===4?4:5;const qs=missionMode?bank.questions.filter(q=>q.game===+game.value&&q.level===mappedLevel):l===6?g[6]:l===3?g[4]:l===4?g[5]:g[2+l];const gradeLabel=l===6?'Kindergarten':l===3?'Grade 1':l===4?'Grade 2':l===2?'High School':l===1?'Middle School':'Elementary';const cp=Math.floor(index/checkpointSize)+1;const cpStart=(cp-1)*checkpointSize;const cpEnd=Math.min(cpStart+checkpointSize,qs.length);const cpTotal=cpEnd-cpStart;quiz.replaceChildren();const h=document.createElement('h2');h.textContent=gradeLabel+' • Checkpoint '+cp;const progress=document.createElement('p');progress.textContent='Question '+(Math.min(index-cpStart+1,cpTotal))+' of '+cpTotal+' · Correct this checkpoint: '+score;quiz.append(h,progress);if(index>=qs.length){const p=document.createElement('p');p.textContent='🎉 All checkpoints complete! Choose a new game to continue your learning journey.';if(index>0){const key=[game.value,level.value,mode.value,Math.ceil(index/checkpointSize)].join(':');awards[key]={correct:score,total:cpTotal||checkpointSize};saveAwards();quiz.append(certificate(g[0],gradeLabel,Math.ceil(index/checkpointSize),score,cpTotal||checkpointSize));const print=document.createElement('button');print.textContent='🖨 Print final certificate';print.onclick=()=>window.print();quiz.append(print)}const nextGame=document.createElement('button');nextGame.textContent='Continue to next game →';nextGame.onclick=()=>{game.value=(+game.value+1)%games.length;reset()};quiz.append(p,nextGame);return}if(index>0&&index%checkpointSize===0&&index<qs.length&&!checkpointAcknowledged){const lastCp=index/checkpointSize;const key=[game.value,level.value,mode.value,lastCp].join(':');const award=awards[key]||{correct:score,total:checkpointSize};awards[key]=award;saveAwards();const done=document.createElement('h3');done.textContent='🎉 Checkpoint '+lastCp+' complete!';const instr=document.createElement('p');instr.textContent='Your mission: 1. Review your score and award. 2. Print or save your certificate if you wish. 3. Select Continue to Checkpoint '+(lastCp+1)+'. 4. Return to the game tools, make a new observation, then answer the next five questions.';const prize=document.createElement('p');prize.textContent='🎁 Virtual prize: '+badgeFor(award.correct,award.total)+' badge and '+(award.correct*20)+' XP. No money or physical goods are awarded.';const print=document.createElement('button');print.textContent='🖨 Print / Save Certificate';print.onclick=()=>window.print();const next=document.createElement('button');next.textContent='Continue to Checkpoint '+(lastCp+1)+' →';next.onclick=()=>{checkpointAcknowledged=true;score=0;render()};quiz.append(done,instr,prize,certificate(g[0],gradeLabel,lastCp,award.correct,award.total),print,next);return}const q=qs[index],title=document.createElement('h3');title.textContent=missionMode?q.question:q[0];if(missionMode){const mission=document.createElement('p');mission.textContent='🎯 MISSION: '+q.mission;const tools=document.createElement('p');tools.textContent='🧰 USE THESE TOOLS: '+q.tool;const instruction=document.createElement('p');instruction.textContent='📋 INSTRUCTIONS: '+q.challenge;quiz.append(mission,tools,instruction)}quiz.append(title);const feedback=document.createElement('p');feedback.className='feedback';(missionMode?q.options:q[1]).forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>{if(locked)return;locked=true;if(i===(missionMode?q.answer:q[2]))score++;feedback.textContent=(i===(missionMode?q.answer:q[2])?'Correct! ':'Try again next time. ')+(missionMode?q.explanation:q[3]);quiz.querySelectorAll('.answer').forEach(x=>x.disabled=true);const next=document.createElement('button');next.textContent=(index+1)%checkpointSize===0?'Claim checkpoint award →':'Next question →';next.addEventListener('click',()=>{index++;checkpointAcknowledged=false;locked=false;render()});quiz.append(next)});quiz.append(b)});quiz.append(feedback)}function reset(){index=0;score=0;locked=false;checkpointAcknowledged=false;render()}game.addEventListener('change',reset);level.addEventListener('change',reset);mode.addEventListener('change',reset);document.getElementById('restart').addEventListener('click',reset);render();</script></body></html>
