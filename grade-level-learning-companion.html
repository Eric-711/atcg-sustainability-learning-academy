<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATCG Grade-Level Learning Companion</title><style>body{margin:0;background:#07192c;color:#edf9ff;font:16px system-ui}header{padding:20px;background:#103354}h1{margin:0 0 8px}main{max-width:1250px;margin:auto;padding:18px}select,button,a{font:inherit}select,button{padding:10px;border-radius:8px}button{cursor:pointer;background:#b6f4dd;color:#09263b;border:0;font-weight:700}a{color:#99eaff}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:16px;margin-top:18px}.panel{background:#102b46;border:1px solid #31516b;border-radius:12px;padding:15px}.gameframe{width:100%;height:620px;border:0;background:#fff;border-radius:8px}.answer{display:block;width:100%;text-align:left;margin:8px 0;background:#dcefff}.answer:disabled{opacity:.75}.feedback{min-height:3em}small{color:#bdd3e3}@media(max-width:850px){.layout{grid-template-columns:1fr}.gameframe{height:430px}}</style></head><body><header><h1>🎓 ATCG Grade-Level Learning Companion</h1><p>Original games stay unchanged. Explore the game, then answer questions at your grade level.</p><a href="index.html">← ATCG Academy Home</a></header><main><div class="controls"><label>Choose game <select id="game"></select></label><label>Grade level <select id="level"><option value="0">Elementary (Grades 3–5)</option><option value="1">Middle School (Grades 6–8)</option><option value="2">High School — original game</option></select></label><button id="restart">Restart questions</button></div><div class="layout"><section class="panel"><h2 id="gameTitle"></h2><p><a id="original" target="_blank" rel="noopener">Open original game in new tab</a></p><iframe class="gameframe" id="frame" title="Original ATCG interactive game" loading="lazy"></iframe><small>If a game cannot run inside this frame, use the original game link above.</small></section><aside class="panel" id="quiz" aria-live="polite"></aside></div></main><script>const games=[["World Explorer","world-explorer.html",[["What does a map show?",["Places and locations","Only animals","Only numbers"],0,"Maps help us find places."],["Which direction is opposite north?",["East","South","West"],1,"South is opposite north."],["What is an ocean?",["A large body of salt water","A mountain","A desert"],0,"Oceans cover much of Earth."]],[["How does latitude help describe a place?",["Its distance north or south of the equator","Its population","Its height above sea level"],0,"Latitude measures angular distance from the equator."],["Why are equatorial regions often warmer?",["They receive more direct sunlight","They are closer to the Moon","They have no seasons"],0,"Sun angle affects energy received per area."],["Which map feature helps compare real distances?",["Scale","Legend color only","Title only"],0,"Scale relates map distance to actual distance."]]],["Future City","open-world.html",[["What does a traffic light help keep safe?",["Road travel","Clouds","Trees"],0,"Traffic signals organize movement."],["Which is renewable energy?",["Sunlight","Coal","Gasoline"],0,"Sunlight is naturally replenished."],["Why do cities need parks?",["For green space","To stop all rain","To remove oxygen"],0,"Parks provide habitat and recreation."]],[["How can public transportation reduce pollution?",["It can reduce vehicles per traveler","It always increases fuel use","It eliminates electricity"],0,"Shared trips can reduce emissions per person."],["Which surface often increases stormwater runoff?",["Pavement","Healthy soil","Grass"],0,"Impervious surfaces prevent infiltration."],["What is a trade-off in city planning?",["Balancing benefits and costs","Ignoring evidence","Choosing randomly"],0,"Design decisions balance competing needs."]]],["Curriculum Adventure Arcade","curriculum-arcade.html",[["What do plants need to grow?",["Light and water","Plastic","Only rocks"],0,"Plants use light and water."],["What is 6 + 4?",["8","10","12"],1,"Six plus four is ten."],["What can a thermometer measure?",["Temperature","Length","Sound"],0,"Thermometers measure temperature."]],[["Which is evidence from an experiment?",["Recorded measurements","A guess","An advertisement"],0,"Measurements are observable evidence."],["A plant grows 2 cm each week. How much in 4 weeks?",["6 cm","8 cm","12 cm"],1,"2 multiplied by 4 is 8."],["Why should scientists repeat trials?",["To check reliability","To hide mistakes","To change the question"],0,"Repeated trials help assess consistency."]]],["Virtual Science Laboratory","virtual-science-lab.html",[["What should you wear to protect your eyes?",["Safety goggles","Sandals","A scarf"],0,"Goggles protect your eyes."],["What happens to ice when it warms?",["It melts","It turns into wood","It disappears forever"],0,"Ice melts into liquid water."],["Which tool measures liquid volume?",["Graduated cylinder","Ruler","Magnet"],0,"Graduated cylinders measure volume."]],[["What is the independent variable?",["What the investigator changes","What is measured","What stays constant"],0,"It is the deliberately changed factor."],["Why use a control group?",["For comparison","To add bias","To avoid measurement"],0,"Controls provide a baseline."],["Which graph best shows temperature over time?",["Line graph","Pie chart","Map"],0,"Line graphs show change over time."]]],["Simulation Lab","simulations.html",[["What is a simulation?",["A model of something real","A kind of lunch","A planet"],0,"Simulations represent systems or processes."],["What happens when water freezes?",["It becomes solid","It becomes fire","It vanishes"],0,"Freezing changes liquid water to ice."],["Which energy source uses moving air?",["Wind turbine","Battery only","Coal mine"],0,"Wind turbines capture energy from moving air."]],[["Why change one variable at a time?",["To identify cause and effect","To make results random","To skip observations"],0,"Controlled changes make effects easier to interpret."],["What is a limitation of a simulation?",["It simplifies reality","It is always perfect","It cannot be tested"],0,"Models cannot represent every detail."],["What increases the output of an ideal wind turbine?",["Greater wind speed","Less moving air","No blades"],0,"Wind speed strongly influences available power."]]],["Sports Exam Challenge","sports-exam-games.html",[["A team scores 3 points twice. Total?",["5","6","9"],1,"Three plus three equals six."],["What does a stopwatch measure?",["Time","Mass","Temperature"],0,"Stopwatches measure elapsed time."],["Which habit helps athletes?",["Drinking water","Skipping sleep","Avoiding practice"],0,"Hydration supports activity."]],[["A runner covers 200 m in 40 s. Average speed?",["5 m/s","8 m/s","40 m/s"],0,"Speed equals distance divided by time."],["Which evidence best compares two training plans?",["Results from repeated trials","One opinion","A slogan"],0,"Repeated comparable measurements support conclusions."],["A score rises from 60 to 75. Percent increase?",["15%","25%","75%"],1,"15 divided by 60 is 25%."]]],["Global Curriculum Explorer","global-curriculum.html",[["What do students around the world use to learn?",["Questions and practice","Only one language","Only games"],0,"Learning uses many approaches."],["Which is a continent?",["Africa","Pacific Ocean","Moon"],0,"Africa is a continent."],["What can help you learn a new word?",["An example","Ignoring it","Guessing forever"],0,"Examples build meaning."]],[["Why compare different regions' ecosystems?",["To identify patterns and differences","To assume they are identical","To avoid evidence"],0,"Comparisons reveal relationships."],["What makes a source trustworthy?",["Evidence and clear authorship","Lots of emojis","No date or author"],0,"Check evidence, expertise, and context."],["Which is a transferable science skill?",["Analyzing data","Memorizing one website address","Skipping measurements"],0,"Data analysis applies across curricula."]]]];const game=document.getElementById('game'),level=document.getElementById('level'),quiz=document.getElementById('quiz'),frame=document.getElementById('frame'),original=document.getElementById('original');games.forEach((g,i)=>game.add(new Option(g[0],i)));let index=0,score=0,locked=false;function render(){const g=games[+game.value],l=+level.value;document.getElementById('gameTitle').textContent=g[0];if(frame.getAttribute('src')!==g[1])frame.src=g[1];original.href=g[1];if(l===2){quiz.replaceChildren();const h=document.createElement('h2');h.textContent='High School';const p=document.createElement('p');p.textContent='Continue with the original high-school activities in the game. No existing content has been replaced.';quiz.append(h,p);return}const qs=g[2+l];quiz.replaceChildren();const h=document.createElement('h2');h.textContent=(l?'Middle School':'Elementary')+' Checkpoint';const progress=document.createElement('p');progress.textContent='Question '+(Math.min(index+1,qs.length))+' of '+qs.length+' · Score '+score;quiz.append(h,progress);if(index>=qs.length){const p=document.createElement('p');p.textContent='Complete! You scored '+score+' out of '+qs.length+'.';quiz.append(p);return}const q=qs[index],title=document.createElement('h3');title.textContent=q[0];quiz.append(title);const feedback=document.createElement('p');feedback.className='feedback';q[1].forEach((answer,i)=>{const b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>{if(locked)return;locked=true;if(i===q[2])score++;feedback.textContent=(i===q[2]?'Correct! ':'Try again next time. ')+q[3];quiz.querySelectorAll('.answer').forEach(x=>x.disabled=true);const next=document.createElement('button');next.textContent=index===qs.length-1?'See results':'Next question';next.addEventListener('click',()=>{index++;locked=false;render()});quiz.append(next)});quiz.append(b)});quiz.append(feedback)}function reset(){index=0;score=0;locked=false;render()}game.addEventListener('change',reset);level.addEventListener('change',reset);document.getElementById('restart').addEventListener('click',reset);render();</script></body></html>
