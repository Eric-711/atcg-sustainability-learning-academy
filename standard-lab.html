<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATCG Standards Interactive Lab</title><style>body{margin:0;background:#081b31;color:#f0f8ff;font:16px system-ui}header,main{padding:18px;max-width:1000px;margin:auto}a{color:#8de7ff}.panel{background:#123450;border:1px solid #48718d;border-radius:14px;padding:18px;margin:14px 0}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}label{display:block}input{width:100%}button{background:#a6eddf;border:0;border-radius:9px;padding:12px;font:inherit;cursor:pointer;margin:5px;color:#09263c}canvas{width:100%;height:240px;background:#071b2e;border-radius:10px}strong{color:#9ef4d4}#status{min-height:25px}</style></head><body><header><a href="curriculum-arcade.html">← Curriculum standards</a><h1 id="title">Interactive Standards Investigation</h1><p>Adjust experimental variables, observe a model, record trials, and explain your evidence.</p></header><main><section class="panel"><h2 id="objective">Investigation</h2><p id="explanation"></p><div class="controls" id="controls"></div><h3>Model result: <strong id="result"></strong></h3><canvas id="chart" width="900" height="260" aria-label="Experimental trial graph"></canvas><p id="status" role="status"></p><button id="record">Record trial</button><button id="reset">Reset</button><button id="export">Export trial data</button></section><section class="panel"><h2>Scientific reasoning</h2><p id="prompt"></p><label for="notes">Explain your hypothesis and evidence</label><textarea id="notes" rows="5" style="display:block;width:95%;background:#06182c;color:white;border:1px solid #6193af;padding:10px"></textarea><button id="save">Save notes</button><p id="saved"></p><a id="source" target="_blank" rel="noopener" href="https://www.dpi.nc.gov/districts-schools/classroom-resources/academic-standards">Official standards reference</a> · <a href="advanced-3d-lab.html">Advanced 3D laboratory</a></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),code=params.get('code')||'ESS.EES.3.4',subject=params.get('subject')||'Science';const definitions=[
{test:/3\.1/,title:'Water and Thermal Energy',description:'Investigate the temperature response of a body of water to an energy input using a simplified heat-capacity relationship.',vars:[['Energy added','energy',0,100,50,'kJ'],['Water mass','mass',1,20,5,'kg']],calc:v=>({value:v.energy/(4.184*v.mass),unit:'°C temperature increase'}),prompt:'Why does increasing water mass reduce temperature change for the same energy input?'},
{test:/3\.3/,title:'Water Cycle and Runoff',description:'Investigate how precipitation and infiltration affect surface runoff in a simplified watershed model.',vars:[['Precipitation','rain',0,100,55,'mm'],['Infiltration fraction','infil',0,100,35,'%']],calc:v=>({value:v.rain*(1-v.infil/100),unit:'mm runoff'}),prompt:'What happens to runoff when infiltration increases at constant precipitation?'},
{test:/3\.4|Weather|Climate/,title:'Greenhouse and Albedo',description:'Explore a simplified climate temperature model with greenhouse gas concentration, solar input, and surface reflectivity.',vars:[['CO₂ concentration','co2',280,1000,420,'ppm'],['Sunlight intensity','sun',40,120,100,'%'],['Albedo','albedo',5,80,30,'%']],calc:v=>({value:14+3*Math.log2(v.co2/420)+(v.sun-100)*.15-(v.albedo-30)*.12,unit:'°C modeled temperature'}),prompt:'Which factor produces the greatest modeled temperature difference? Test one variable at a time.'},
{test:/Bio\.1\.2|Enzyme/,title:'Enzyme Activity',description:'Explore a conceptual enzyme activity curve. This is an illustrative model, not a measurement of a particular enzyme.',vars:[['Temperature','temp',0,80,37,'°C'],['pH','ph',1,14,7,'pH']],calc:v=>({value:100*Math.exp(-Math.pow((v.temp-37)/18,2))*Math.exp(-Math.pow((v.ph-7)/2.5,2)),unit:'% relative activity'}),prompt:'How do temperature and pH influence enzyme activity in this model?'},
{test:/Bio\.1\.1|Cell|osmosis/i,title:'Cell Osmosis',description:'Model cell volume change due to different solute concentrations inside and outside a cell.',vars:[['Outside solute','outside',0,15,8,'%'],['Inside solute','inside',0,15,5,'%'],['Exposure time','time',0,60,20,'min']],calc:v=>({value:Math.max(-60,Math.min(60,(v.inside-v.outside)*v.time*.23)),unit:'% cell volume change'}),prompt:'How does an external hypertonic solution affect cell volume?'},
{test:/Energy|Engineering|solar/i,title:'Solar Power Engineering',description:'Test a simplified solar electrical power model.',vars:[['Sunlight','sun',0,100,70,'%'],['Panel area','area',1,10,4,'units'],['Efficiency','eff',5,30,20,'%']],calc:v=>({value:v.sun*v.area*v.eff*.005,unit:'W electrical power'}),prompt:'Which variable most strongly influences power in your tests?'},
{test:/.*/,title:'Data and Relationships',description:'Investigate how a changing input affects an output. This is a general mathematical exploration, not a standard-specific science model.',vars:[['Input A','a',0,100,50,'units'],['Multiplier B','b',1,10,3,'×']],calc:v=>({value:v.a*v.b,unit:'model units'}),prompt:'Describe the relationship between the independent and dependent variables.'}
];const lab=definitions.find(d=>d.test.test(code));let values={},trials=[];$('title').textContent=code+' · '+lab.title;$('objective').textContent=subject+' — '+lab.title;$('explanation').textContent=lab.description;$('prompt').textContent=lab.prompt;function result(){const r=lab.calc(values);return {value:Math.round(r.value*100)/100,unit:r.unit}}function draw(){const c=$('chart'),g=c.getContext('2d');if(!g)return;g.clearRect(0,0,c.width,c.height);g.strokeStyle='#7198b4';g.beginPath();g.moveTo(50,10);g.lineTo(50,225);g.lineTo(880,225);g.stroke();if(!trials.length){g.fillStyle='#c3e1ec';g.font='20px system-ui';g.fillText('Record a trial to see results.',75,110);return}const vals=trials.map(t=>t.result),lo=Math.min(0,...vals),hi=Math.max(1,...vals),range=hi-lo||1;g.strokeStyle='#83eecb';g.lineWidth=3;g.beginPath();trials.forEach((t,i)=>{const x=50+i/Math.max(1,trials.length-1)*820,y=225-(t.result-lo)/range*190;i?g.lineTo(x,y):g.moveTo(x,y)});g.stroke();g.fillStyle='#f4d27a';trials.forEach((t,i)=>{const x=50+i/Math.max(1,trials.length-1)*820,y=225-(t.result-lo)/range*190;g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.fill()})}function update(){$('result').textContent=result().value+' '+result().unit;draw()}function init(){values=Object.fromEntries(lab.vars.map(v=>[v[1],v[4]]));trials=[];$('controls').replaceChildren();lab.vars.forEach(([label,key,min,max,def,unit])=>{const wrap=document.createElement('label');const name=document.createElement('span');name.textContent=label+' ';const out=document.createElement('strong');out.textContent=def+' '+unit;const input=document.createElement('input');input.type='range';input.min=min;input.max=max;input.value=def;input.oninput=()=>{values[key]=Number(input.value);out.textContent=input.value+' '+unit;update()};wrap.append(name,out,input);$('controls').append(wrap)});$('status').textContent='Change a variable, then record a trial.';update()}$('record').onclick=()=>{trials.push({trial:trials.length+1,...values,result:result().value});$('status').textContent=trials.length+' trial(s) recorded';update()};$('reset').onclick=init;$('export').onclick=()=>{if(!trials.length){$('status').textContent='Record at least one trial first.';return}const keys=Object.keys(trials[0]),csv=[keys.join(','),...trials.map(t=>keys.map(k=>t[k]).join(','))].join('\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),a=document.createElement('a');a.href=url;a.download='atcg-'+code.replace(/[^a-z0-9.-]/gi,'-')+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('save').onclick=()=>{try{localStorage.setItem('atcg-notes-'+code,$('notes').value);$('saved').textContent='Notes saved on this device.'}catch{$('saved').textContent='Local storage unavailable. Copy your notes before leaving.'}};try{$('notes').value=localStorage.getItem('atcg-notes-'+code)||''}catch{}init()})();</script></body></html>
