<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATCG Competition Arena</title><style>body{margin:0;background:#071a34;color:white;font:16px system-ui}main{max-width:800px;margin:auto;padding:22px}a{color:#9af4df}.panel{background:#173a5e;border-radius:18px;padding:22px;margin:20px 0}.buttons{display:grid;gap:12px}button{padding:15px;border:0;border-radius:10px;font:inherit;font-weight:bold;background:#a8f5dd;color:#072842;cursor:pointer;text-align:left}button:disabled{opacity:.6}#feedback{min-height:45px}select{padding:12px;border-radius:8px;font:inherit}h1{font-size:clamp(2rem,5vw,3rem)}</style></head><body><main><a href="index.html">← Academy home</a><h1>🏝️ Competition Arena 🏠</h1><p>Play educational Survivor and Big Brother-style strategy challenges. These are original classroom games, not official television-show games.</p><div class="panel"><label for="mode">Choose a game </label><select id="mode"><option value="survivor">🏝️ Survivor: Eco Island</option><option value="brother">🏠 Big Brother: Learning House</option></select><button id="start">▶ Start competition</button></div><div class="panel" id="arena" hidden><h2 id="title"></h2><p id="round"></p><h3 id="question"></h3><div class="buttons" id="answers"></div><p id="feedback" role="status"></p><button id="next" hidden>Next challenge →</button><p id="score"></p></div></main><script>const data={survivor:[["Your island has limited fresh water. Which strategy is most sustainable?",["Collect rainwater and filter it","Drink seawater","Remove all vegetation"],0,"Rainwater collection and treatment help protect freshwater supplies."],["A drought reduces grass growth. What happens to herbivores?",["Food availability may decline","They gain unlimited food","No population effects are possible"],0,"Reduced primary production can limit herbivore populations."],["Your team needs renewable electricity. Which design works in sunny conditions?",["Solar panel and battery","Diesel-only generator","Burn forest biomass without replanting"],0,"Solar electricity can be stored for later use."]],brother:[["The house needs a fair vote. Which approach supports valid results?",["One vote per eligible participant","Count only friends","Change rules after voting"],0,"Consistent voting rules support fairness."],["Your team has $120 for 4 equal supply kits. What is the maximum per kit?",["$30","$40","$20"],0,"120 divided by 4 equals 30."],["Two teams disagree about a science claim. What should decide?",["Testable evidence","The loudest speaker","Random guessing"],0,"Evidence and repeatable tests support scientific reasoning."]]};let mode,idx,points,locked;const $=id=>document.getElementById(id);function render(){locked=false;const q=data[mode][idx];$('round').textContent='Challenge '+(idx+1)+' of '+data[mode].length;$('question').textContent=q[0];$('answers').replaceChildren();q[1].forEach((choice,i)=>{const b=document.createElement('button');b.textContent=choice;b.onclick=()=>{if(locked)return;locked=true;points+=Number(i===q[2]);$('feedback').textContent=(i===q[2]?'Correct! ':'Not quite. ')+q[3];[...$('answers').children].forEach(x=>x.disabled=true);$('next').hidden=false;$('score').textContent='Points: '+points};$('answers').append(b)});$('feedback').textContent='';$('next').hidden=true;$('score').textContent='Points: '+points}function start(){mode=$('mode').value;idx=0;points=0;$('arena').hidden=false;$('title').textContent=mode==='survivor'?'🏝️ Eco Island Survival':'🏠 Learning House Challenge';render();$('arena').scrollIntoView({behavior:'smooth'})}$('start').onclick=start;$('next').onclick=()=>{idx++;if(idx>=data[mode].length){$('round').textContent='Competition complete';$('question').textContent='Final score: '+points+' / '+data[mode].length;$('answers').replaceChildren();$('feedback').textContent='Choose Start competition to play again.';$('next').hidden=true}else render()};</script></body></html>
