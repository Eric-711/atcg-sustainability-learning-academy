<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATCG Sustainability Learning Academy — Mission Control</title><style>body{margin:0;background:#081b33;color:#eff8ff;font:16px system-ui}main{max-width:950px;margin:auto;padding:20px}header{background:linear-gradient(100deg,#124b70,#168a9e);padding:25px;text-align:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card,.scene{background:#153b59;border:1px solid #427a96;border-radius:16px;padding:20px;margin:12px 0}button{background:#a4e8f8;color:#06233c;border:0;padding:12px 16px;border-radius:9px;font-weight:700;cursor:pointer;margin:5px}button:focus-visible{outline:3px solid yellow}.bar{height:19px;border-radius:20px;background:#082239;overflow:hidden}.fill{height:100%;background:#8ee5ac;transition:width .3s}.muted{color:#c4d8e7}input{width:100%;accent-color:#78d5f0}label{display:block;margin:18px 0}.hidden{display:none}.feedback{border-left:4px solid #8ee5ac;padding:12px;background:#092740;min-height:40px}.stat{font-size:1.5rem;font-weight:700}a{color:#b9e6ff}</style></head><body><header><h1>🌎 ATCG SUSTAINABILITY LEARNING ACADEMY</h1><p>Mission Control — interactive science adventures</p></header><main><p><a href="index.html">← Academy home</a> · <a href="simulations.html">Simulation Lab</a></p><div id="menu"><h2>Choose an adventure</h2><div class="grid" id="cards"></div></div><section id="game" class="hidden"><button onclick="home()">← Missions</button><h2 id="title"></h2><p id="story"></p><div id="controls" class="card"></div><div id="scene" class="scene"></div><p id="feedback" class="feedback" role="status"></p></section><p class="muted">Free educational preview. No payment or personal information required. Scientific models are simplified for learning.</p></main><script>
const $=id=>document.getElementById(id);let mode,round=0,score=0,goal=0;
const games=[{id:'solar',icon:'☀️',title:'Solar City Architect',desc:'Build a renewable-powered town. Balance solar capacity, energy storage, and demand across three weather events.'},{id:'reef',icon:'🐠',title:'Coastal Ecosystem Rescue',desc:'Restore water quality, coral habitat, and fish biodiversity over five years.'},{id:'cell',icon:'🧫',title:'Cell Membrane Mission',desc:'Move water and particles through a cell. Explore osmosis, diffusion, and concentration gradients.'},{id:'farm',icon:'🌱',title:'Sustainable Farm Simulator',desc:'Choose irrigation, soil care, and fertilizer to grow crops without harming the watershed.'}];
games.forEach(g=>{let d=document.createElement('article');d.className='card';d.innerHTML='<div style="font-size:3rem">'+g.icon+'</div><h3>'+g.title+'</h3><p>'+g.desc+'</p>';let b=document.createElement('button');b.textContent='Play mission';b.onclick=()=>start(g.id);d.append(b);$('cards').append(d)});
function home(){$('menu').classList.remove('hidden');$('game').classList.add('hidden')}function start(id){mode=id;round=0;score=0;goal=id==='reef'?5:3;$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('title').textContent=games.find(g=>g.id===id).title;$('story').textContent=games.find(g=>g.id===id).desc;setup()}
function slider(id,label,min,max,val,unit){return '<label>'+label+' <strong id="'+id+'v">'+val+unit+'</strong><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" value="'+val+'" oninput="document.getElementById(\''+id+'v\').textContent=this.value+\''+unit+'\';evaluate()"></label>'}
function setup(){if(round>=goal){$('controls').innerHTML='<h3>Mission complete!</h3><p>You earned '+score+' points out of '+goal*100+'.</p><button onclick="start(mode)">Play again</button>';$('scene').innerHTML='<div style="font-size:5rem">🏆</div>';msg('Explain your most successful decision and one trade-off.');return}
let c='',s='';if(mode==='solar'){const weather=['Sunny day','Cloudy afternoon','Stormy evening'][round];s='Weather event '+(round+1)+' of 3: '+weather;c=slider('panels','Solar panels',0,20,10,'')+slider('battery','Battery capacity',0,100,50,'%')+slider('demand','Electricity demand',20,100,60,'%');}
if(mode==='reef'){s='Restoration year '+(round+1)+' of 5';c=slider('pollution','Pollution',0,100,50,'%')+slider('habitat','Protected habitat',0,100,45,'%')+slider('fishing','Fishing pressure',0,100,55,'%');}
if(mode==='cell'){s=['Cell placed in hypotonic solution','Cell placed in hypertonic solution','Cell placed in isotonic solution'][round];c=slider('outside','Outside solute concentration',0,100,50,'%')+slider('inside','Inside solute concentration',0,100,50,'%');}
if(mode==='farm'){s=['Dry season','Rainy season','Harvest season'][round];c=slider('irrigation','Irrigation',0,100,50,'%')+slider('soil','Soil conservation',0,100,50,'%')+slider('fertilizer','Fertilizer use',0,100,50,'%');}
$('controls').innerHTML='<h3>'+s+'</h3>'+c+'<button onclick="commit()">Commit decision →</button>';$('scene').innerHTML='<h3>Live model outcome</h3><p id="outcome"></p><div class="bar"><div class="fill" id="meter"></div></div><p class="muted" id="hint"></p>';$('feedback').textContent='Adjust the variables and predict what will happen.';evaluate()}
function val(id){return +$(id).value}function clamp(x){return Math.max(0,Math.min(100,Math.round(x)))}function evaluate(){let n=0,h='';if(mode==='solar'){let sun=[1,.4,.1][round];let production=val('panels')*5*sun+val('battery')*.45;let demand=val('demand');n=clamp(100-Math.max(0,demand-production)*1.5-Math.max(0,production-demand)*.1);h='Generation plus storage: '+Math.round(production)+' energy units; demand: '+demand+'. Weather affects solar output.'}
if(mode==='reef'){n=clamp(35+val('habitat')*.65-val('pollution')*.35-val('fishing')*.25);h='Habitat protection raises ecosystem resilience; pollution and excessive fishing reduce it.'}
if(mode==='cell'){let difference=val('outside')-val('inside');let expected=[-30,30,0][round];n=clamp(100-Math.abs(difference-expected)*2);h=difference>5?'Outside is hypertonic: water tends to move out of the cell.':difference< -5?'Outside is hypotonic: water tends to move into the cell.':'Similar solute concentrations: little net water movement.'}
if(mode==='farm'){let target=[75,35,55][round];n=clamp(100-Math.abs(val('irrigation')-target)*.65-Math.max(0,val('fertilizer')-55)*.45+val('soil')*.15);h='Soil conservation supports resilience. Too much irrigation or fertilizer can waste resources or increase runoff.'}
window.current=clamp(n);$('outcome').textContent='Sustainability / mission success: '+window.current+'%';$('meter').style.width=window.current+'%';$('hint').textContent=h}
function msg(x){$('feedback').textContent=x}function commit(){let earned=window.current;score+=earned;round++;msg('You earned '+earned+' points. Next scenario unlocked.');setup()}
</script></body></html>
